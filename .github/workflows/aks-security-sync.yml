# ==============================================================================
# Reusable Called Workflow: AKS Security Policies & Gatekeeper Admission Sync
# Applies Zero-Trust East-West NetworkPolicies and audits OPA Gatekeeper constraints
# Central Org Standard: RepoCodeGanesh/.github
# ==============================================================================

name: Reusable AKS Security Sync

on:
  workflow_call:
    inputs:
      cluster_name:
        description: 'Target AKS Managed Cluster name'
        required: true
        type: string
      resource_group:
        description: 'Resource Group containing the cluster'
        required: true
        type: string
      subscription_id:
        description: 'Azure Subscription ID for OIDC auth'
        required: true
        type: string
      namespace:
        description: 'Target Kubernetes namespace'
        required: true
        type: string
      network_policy_dir:
        description: 'Directory path containing NetworkPolicy YAMLs'
        required: false
        type: string
        default: 'app/bank-compliance/k8s/networkpolicy/'
      environment_name:
        description: 'GitHub Environment name'
        required: false
        type: string
        default: 'bank-compliance-prod'
    secrets:
      APP_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  security-sync:
    name: 🛡️ Security Policies Sync (Gatekeeper & NetworkPolicy)
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment_name }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ inputs.subscription_id }}

      - name: Get AKS Credentials
        run: |
          az aks get-credentials \
            --name "${{ inputs.cluster_name }}" \
            --resource-group "${{ inputs.resource_group }}" \
            --overwrite-existing

      - name: Validate & Apply NetworkPolicies (S2 Zero-Trust)
        shell: bash
        run: |
          if [ -d "${{ inputs.network_policy_dir }}" ]; then
            echo "► Pre-flight server-side dry-run for NetworkPolicies"
            kubectl apply --dry-run=server -f "${{ inputs.network_policy_dir }}" -n "${{ inputs.namespace }}"
            echo "► Atomically applying Zero-Trust NetworkPolicies"
            kubectl apply -f "${{ inputs.network_policy_dir }}" -n "${{ inputs.namespace }}"
            echo "► Active NetworkPolicies:"
            kubectl get networkpolicy -n "${{ inputs.namespace }}"
          else
            echo "ℹ️ No network policies found in ${{ inputs.network_policy_dir }}. Skipping."
          fi

      - name: Audit Azure Policy Gatekeeper Admission Controls
        shell: bash
        run: |
          echo "► Verifying Azure Policy Gatekeeper constraints active on AKS cluster"
          kubectl get constraints -o custom-columns="KIND:.kind,NAME:.metadata.name,ENFORCEMENT:.spec.enforcementAction,VIOLATIONS:.status.totalViolations" || true
          echo "✅ Azure Policy Gatekeeper admission controls verified"
