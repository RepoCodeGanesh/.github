# ==============================================================================
# Reusable Called Workflow: Universal Container Build, Security Scan & Push
# Builds multi-stage Docker images, scans with Trivy, and pushes to GHCR
# Central Org Standard: RepoCodeGanesh/.github
# ==============================================================================

name: Reusable Container Build & Push

on:
  workflow_call:
    inputs:
      context_dir:
        description: 'Directory containing the Dockerfile'
        required: true
        type: string
      image_name:
        description: 'Image name (e.g. repo_owner/app-name)'
        required: true
        type: string
      registry:
        description: 'Container registry'
        required: false
        type: string
        default: 'ghcr.io'
      sha:
        description: 'Git commit SHA for tagging'
        required: true
        type: string
      push:
        description: 'Whether to push to registry'
        required: false
        type: boolean
        default: true
      trivy_severity:
        description: 'Trivy scanner severity threshold'
        required: false
        type: string
        default: 'CRITICAL,HIGH'
    outputs:
      image_tag:
        description: 'Full image latest tag'
        value: ${{ jobs.build-and-push.outputs.image_tag }}
      image_sha_tag:
        description: 'Full image commit SHA tag'
        value: ${{ jobs.build-and-push.outputs.image_sha_tag }}

permissions:
  contents: read
  packages: write
  security-events: write
  actions: read

jobs:
  build-and-push:
    name: ?? Docker Build & Trivy Scan (${{ inputs.image_name }})
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.prep_tag.outputs.image_tag }}
      image_sha_tag: ${{ steps.prep_tag.outputs.image_sha_tag }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase Image Name & Compute Tags
        id: prep_tag
        run: |
          RAW_NAME="${{ inputs.image_name }}"
          if [[ "$RAW_NAME" != *"/"* ]]; then
            RAW_NAME="${{ github.repository_owner }}/$RAW_NAME"
          fi
          IMAGE_LOWER=$(echo "${{ inputs.registry }}/${RAW_NAME}" | tr '[:upper:]' '[:lower:]')
          echo "image_tag=${IMAGE_LOWER}:latest" >> $GITHUB_OUTPUT
          echo "image_sha_tag=${IMAGE_LOWER}:${{ inputs.sha }}" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.context_dir }}
          push: ${{ inputs.push && github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.prep_tag.outputs.image_tag }}
            ${{ steps.prep_tag.outputs.image_sha_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: ?? Trivy Container Security Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ steps.prep_tag.outputs.image_sha_tag }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: ${{ inputs.trivy_severity }}
          exit-code: '0'

      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-container-${{ inputs.image_name }}'
